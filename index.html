<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kirkenta Inc. · Menú</title><style>
:root{--fondo:#fff7ed;--tarjeta:#fff;--texto:#1c1917;--suave:#78716c;--borde:#e7e5e4;--acento:#ea580c;--acento-2:#c2410c;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--fondo:#1c1917;--tarjeta:#292524;--texto:#fafaf9;--suave:#a8a29e;--borde:#44403c;--acento:#fb923c;--acento-2:#f97316}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fondo);color:var(--texto)}
header{padding:20px 16px 10px;text-align:center}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;color:var(--suave);font-size:14px}
.mesa{display:inline-block;margin-top:8px;background:var(--acento);color:#fff;padding:4px 12px;border-radius:999px;font-weight:700}
nav{position:sticky;top:0;background:var(--fondo);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;z-index:5;border-bottom:1px solid var(--borde)}
nav button{flex:none;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
nav button.on{background:var(--acento);border-color:var(--acento);color:#fff}
main{padding:12px 16px 120px;max-width:760px;margin:0 auto;display:grid;gap:10px}
.plato{display:flex;gap:12px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:16px;padding:12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.plato[disabled]{opacity:.5;cursor:not-allowed}.plato img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.plato .ico{width:84px;height:84px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:42px;background:rgba(234,88,12,.12)}
.promo{display:inline-block;background:#dc2626;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;margin:2px 4px 2px 0}
.antes{text-decoration:line-through;color:var(--suave);font-weight:400;margin-right:6px}.ahorro{color:#dc2626;font-weight:700}
.plato b{display:block;font-size:16px}.plato small{display:block;color:var(--suave);margin:3px 0}.plato .precio{font-weight:800;color:var(--acento)}
.carrito{position:fixed;left:12px;right:12px;bottom:12px;max-width:736px;margin:0 auto;background:var(--acento);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;display:none;justify-content:space-between;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.capa{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.capa.on{display:flex}.hoja{background:var(--tarjeta);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.hoja h2{margin:0 0 10px}.op{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--borde);border-radius:12px;margin:5px 0}
.fila{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--borde)}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--borde);border-radius:12px;background:var(--fondo);color:var(--texto);font-size:16px;margin:4px 0}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-p{background:var(--acento);color:#fff}.btn-w{background:#25d366;color:#fff}.btn-s{background:transparent;color:var(--texto);border:1px solid var(--borde)}
.tipos{display:flex;gap:6px}.tipos label{flex:1;text-align:center;border:1px solid var(--borde);border-radius:12px;padding:10px 4px;cursor:pointer;font-size:14px}
.tipos input{display:none}.tipos label.on{border-color:var(--acento);background:var(--acento);color:#fff}
.cant{display:flex;align-items:center;gap:10px}.cant button{width:38px;height:38px;border-radius:50%;border:1px solid var(--borde);background:var(--fondo);color:var(--texto);font-size:20px}
.ok{text-align:center;padding:20px 6px}.ok b{font-size:44px;display:block;color:var(--ok)}.suave{color:var(--suave);font-size:13px}</style></head><body>

(function(){
var M=MENU,C=CONF,carrito=[],cat=null;
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function L(n){return 'L. '+(Math.round(n*100)/100).toFixed(2);}
function $(id){return document.getElementById(id);}
/* Promociones: valen según fecha, día y hora de este celular; el negocio confirma el precio final al cobrar */
function hhmm(d){return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function vigente(p,ahora){var f=ahora.getFullYear()+'-'+('0'+(ahora.getMonth()+1)).slice(-2)+'-'+('0'+ahora.getDate()).slice(-2);
if(p.desde&&f<p.desde)return false;if(p.hasta&&f>p.hasta)return false;
if(p.dias&&p.dias.indexOf(String(ahora.getDay()||7))<0)return false;
if(p.horaIni||p.horaFin){var h=hhmm(ahora),i=p.horaIni||'00:00',x=p.horaFin||'23:59';if(i<=x?(h<i||h>x):(h<i&&h>x))return false;}return true;}
function promosDe(pl){if(!pl.desc)return [];var ahora=new Date();return (M.promociones||[]).filter(function(p){
return (p.productoId?p.productoId===pl.id:(!p.categoriaId||p.categoriaId===pl.categoriaId))&&vigente(p,ahora);});}
function descuento(p,precio,cant){var bruto=precio*cant;
if(p.tipo==='Porcentaje')return bruto*p.porcentaje/100;if(p.tipo==='Volumen')return cant>=p.minimo?bruto*p.porcentaje/100:0;
if(p.tipo==='NxM')return Math.floor(cant/p.n)*(p.n-p.m)*precio;return 0;}
function ahorro(){var por={};carrito.forEach(function(x){var g=por[x.id]||(por[x.id]={cant:0,bruto:0});g.cant+=x.cant;g.bruto+=x.precio*x.cant;});
var t=0;Object.keys(por).forEach(function(id){var pl=M.platillos.find(function(p){return p.id===+id;});if(!pl)return;var g=por[id],u=g.bruto/g.cant,mejor=0;
promosDe(pl).forEach(function(p){var d=Math.min(descuento(p,u,g.cant),g.bruto);if(d>mejor)mejor=d;});t+=Math.round(mejor*100)/100;});return t;}
$('negocio').textContent=M.negocio;$('info').textContent=[M.mensaje,M.direccion].filter(Boolean).join(' · ');
if(C.mesa)$('mesa').innerHTML='<span class="mesa">'+e(C.mesa)+'</span>';
var cats=$('cats');cats.innerHTML='<button class="on" data-c="">Todo</button>'+M.categorias.map(function(c){return '<button data-c="'+c.id+'">'+e(c.icono)+' '+e(c.nombre)+'</button>';}).join('');
cats.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;cats.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');cat=b.dataset.c?+b.dataset.c:null;pintar();});
function pintar(){var l=M.platillos.filter(function(p){return !cat||p.categoriaId===cat;});
$('lista').innerHTML=l.map(function(p){return '<button class="plato" data-id="'+p.id+'"'+(p.agotado?' disabled':'')+'>'+(p.foto?'<img src="'+e(p.foto)+'" alt="" loading="lazy">':'<span class="ico"'+(p.color?' style="background:'+e(p.color)+'22"':'')+' aria-hidden="true">'+e(p.icono)+'</span>')+'<span><b>'+e(p.nombre)+'</b>'+(p.descripcion?'<small>'+e(p.descripcion)+'</small>':'')+etiquetas(p)+'<span class="precio">'+(p.agotado?'Agotado':precioCon(p))+'</span></span></button>';}).join('')||'<p class="suave">Pronto agregaremos platillos.</p>';}
function etiquetas(p){return promosDe(p).map(function(x){return '<span class="promo">🔥 '+e(x.texto)+'</span>';}).join('')+(promosDe(p).length?'<br>':'');}
function precioCon(p){var pct=promosDe(p).filter(function(x){return x.tipo==='Porcentaje';}).reduce(function(m,x){return Math.max(m,x.porcentaje);},0);
return pct>0?'<span class="antes">'+L(p.precio)+'</span>'+L(p.precio*(1-pct/100)):L(p.precio);}
pintar();
$('lista').addEventListener('click',function(ev){var b=ev.target.closest('.plato');if(!b||b.disabled)return;abrirPlato(M.platillos.find(function(p){return p.id===+b.dataset.id;}));});
var actual=null,cantidad=1;
function abrirPlato(p){actual=p;cantidad=1;var h=$('hojaPlato');
h.innerHTML='<h2>'+e(p.nombre)+'</h2>'+(p.descripcion?'<p class="suave">'+e(p.descripcion)+'</p>':'')+
p.grupos.map(function(g){return '<p><b>'+e(g.nombre)+'</b> <span class="suave">'+(g.obligatorio?'obligatorio':'opcional')+(g.multiple?'':' · elige una')+'</span></p>'+g.opciones.map(function(o){return '<label class="op"><input type="'+(g.multiple?'checkbox':'radio')+'" name="g'+g.id+'" value="'+o.id+'" data-extra="'+o.extra+'" data-nombre="'+e(o.nombre)+'" style="width:auto;margin:0"> '+e(o.nombre)+(o.extra>0?' <span class="suave">+'+L(o.extra)+'</span>':'')+'</label>';}).join('');}).join('')+
'<input id="nota" placeholder="Nota (opcional): sin hielo, bien cocido…" maxlength="150">'+
'<div class="cant" style="margin:10px 0"><button type="button" id="menos">−</button><b id="numCant">1</b><button type="button" id="mas">+</button></div>'+
'<button class="btn btn-p" id="agregar"></button><button class="btn btn-s" id="cerrarPlato">Cancelar</button>';
function total(){var x=p.precio;h.querySelectorAll('input:checked').forEach(function(i){x+=+i.dataset.extra;});$('agregar').textContent='Agregar · '+L(x*cantidad);return x;}
h.querySelectorAll('input').forEach(function(i){i.addEventListener('change',total);});
$('menos').onclick=function(){if(cantidad>1){cantidad--;$('numCant').textContent=cantidad;total();}};
$('mas').onclick=function(){if(cantidad<50){cantidad++;$('numCant').textContent=cantidad;total();}};
$('cerrarPlato').onclick=function(){$('capaPlato').classList.remove('on');};
$('agregar').onclick=function(){for(var i=0;i<p.grupos.length;i++){var g=p.grupos[i];if(g.obligatorio&&!h.querySelector('input[name="g'+g.id+'"]:checked')){alert('Elige '+g.nombre);return;}}
var ops=[],textos=[];h.querySelectorAll('input:checked').forEach(function(i){ops.push(+i.value);textos.push(i.dataset.nombre+(+i.dataset.extra>0?' +'+(+i.dataset.extra).toFixed(2):''));});
carrito.push({id:p.id,nombre:p.nombre,cant:cantidad,precio:total(),ops:ops,textos:textos,nota:$('nota').value.trim()});
$('capaPlato').classList.remove('on');barra();};
total();$('capaPlato').classList.add('on');}
function bruto(){return carrito.reduce(function(s,x){return s+x.precio*x.cant;},0);}
function suma(){return Math.max(0,bruto()-ahorro());}
function barra(){var n=carrito.reduce(function(s,x){return s+x.cant;},0);var b=$('verCarrito');b.style.display=n?'flex':'none';$('carritoCant').textContent='🛒 '+n+' platillo(s)';$('carritoTotal').textContent=L(suma());}
var tipo=C.mesa?'Mesa':'Llevar';
$('verCarrito').onclick=function(){var h=$('hojaCarrito');
var tipos=C.mesa?'':'<div class="tipos"><label data-t="Llevar">🥡 Para llevar</label><label data-t="Domicilio">🛵 A domicilio</label></div>';
h.innerHTML='<h2>Tu pedido</h2>'+carrito.map(function(x,i){return '<div class="fila"><span><b>'+x.cant+'×</b> '+e(x.nombre)+(x.textos.length?'<br><span class="suave">'+e(x.textos.join(', '))+'</span>':'')+(x.nota?'<br><span class="suave">📝 '+e(x.nota)+'</span>':'')+'</span><span>'+L(x.precio*x.cant)+' <button data-q="'+i+'" style="border:0;background:none;color:inherit;font-size:18px" aria-label="Quitar">✕</button></span></div>';}).join('')+
(ahorro()>0?'<div class="fila"><span>Subtotal</span><span>'+L(bruto())+'</span></div><div class="fila ahorro"><span>🔥 Promociones</span><span>−'+L(ahorro())+'</span></div>':'')+'<div class="fila"><b>Total</b><b>'+L(suma())+'</b></div>'+tipos+
'<input id="cNombre" placeholder="Tu nombre" maxlength="80" autocomplete="name">'+(C.mesa?'':'<input id="cTel" placeholder="Teléfono" inputmode="tel" maxlength="25" autocomplete="tel"><input id="cDir" placeholder="Dirección de entrega" maxlength="250" style="display:none">')+
'<input id="cNotas" placeholder="Notas para el negocio (opcional)" maxlength="200">'+
(C.enLocal&&C.urlPedido?'<button class="btn btn-p" id="enviarDirecto">Enviar pedido</button>':(puedeRelevo()?'<button class="btn btn-p" id="enviarRelevo">Enviar pedido</button>':''))+
(M.whatsapp?'<button class="btn btn-w" id="enviarWa">Enviar por WhatsApp</button>':'')+
'<button class="btn btn-s" id="cerrarCarrito">Seguir pidiendo</button><p class="suave">Precios con ISV. El negocio confirma tu pedido.</p>';
h.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){carrito.splice(+b.dataset.q,1);barra();if(!carrito.length)$('capaCarrito').classList.remove('on');else $('verCarrito').onclick();};});
h.querySelectorAll('[data-t]').forEach(function(l){if(l.dataset.t===tipo)l.classList.add('on');l.onclick=function(){tipo=l.dataset.t;h.querySelectorAll('[data-t]').forEach(function(x){x.classList.toggle('on',x===l);});$('cDir').style.display=tipo==='Domicilio'?'':'none';};});
if($('cDir'))$('cDir').style.display=tipo==='Domicilio'?'':'none';
$('cerrarCarrito').onclick=function(){$('capaCarrito').classList.remove('on');};
if($('enviarDirecto'))$('enviarDirecto').onclick=enviarDirecto;if($('enviarRelevo'))$('enviarRelevo').onclick=enviarRelevo;if($('enviarWa'))$('enviarWa').onclick=enviarWa;
$('capaCarrito').classList.add('on');};
function datos(){var n=$('cNombre').value.trim(),t=$('cTel')?$('cTel').value.trim():'',d=$('cDir')?$('cDir').value.trim():'';
if(!n){alert('Escribe tu nombre');return null;}if(!C.mesa&&!t){alert('Escribe tu teléfono');return null;}if(tipo==='Domicilio'&&!d){alert('Escribe la dirección de entrega');return null;}
return {nombre:n,telefono:t,direccion:d,notas:$('cNotas').value.trim()};}
var codigo='W-'+Math.random().toString(36).slice(2,8).toUpperCase();
function mensaje(c){var tipoTxt=tipo==='Mesa'?'Comer aquí - '+C.mesa:(tipo==='Domicilio'?'A domicilio':'Para llevar');
var l=['*Pedido #'+codigo+'*','Nombre: '+c.nombre];if(c.telefono)l.push('Teléfono: '+c.telefono);l.push('Tipo: '+tipoTxt);if(c.direccion)l.push('Dirección: '+c.direccion);if(c.notas)l.push('Notas: '+c.notas);l.push('--');
carrito.forEach(function(x){l.push(x.cant+' x '+x.nombre+' [P'+x.id+x.ops.map(function(o){return '-O'+o;}).join('')+']'+(x.textos.length?' ('+x.textos.join(', ')+')':'')+(x.nota?' Nota: '+x.nota:''));});
l.push('--');if(ahorro()>0)l.push('Promociones: -'+L(ahorro()));l.push('Total aprox: '+L(suma()));return l.join('\n');}
function listo(titulo,extra){var pago=M.enlacePago?M.enlacePago.replace('{total}',suma().toFixed(2)).replace('{pedido}',encodeURIComponent(codigo)):null;
$('hojaCarrito').innerHTML='<div class="ok"><b>✓</b><h2>'+titulo+'</h2><p>'+extra+'</p>'+(pago?'<a class="btn btn-p" style="display:block;text-decoration:none" href="'+e(pago)+'" target="_blank" rel="noopener">💳 Pagar con tarjeta ('+L(suma())+')</a><p class="suave">Guarda el comprobante: el negocio lo confirma con la referencia.</p>':'')+'<button class="btn btn-s" onclick="location.reload()">Hacer otro pedido</button></div>';
carrito=[];barra();}
function enviarWa(){var c=datos();if(!c)return;window.open('https://wa.me/'+M.whatsapp+'?text='+encodeURIComponent(mensaje(c)),'_blank');listo('¡Casi listo!','Envía el mensaje que se abrió en WhatsApp. Tu pedido es el <b>#'+codigo+'</b>.');}
function puedeRelevo(){return !!(M.relevo&&window.crypto&&crypto.subtle&&window.TextEncoder);}
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function deB64(t){var s=atob(t),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer;}
function pedidoJson(c){return JSON.stringify({codigo:codigo,tipo:tipo,canal:'WhatsApp',nombre:c.nombre,telefono:c.telefono,direccion:c.direccion,notas:c.notas,lineas:carrito.map(function(x){return{productoId:x.id,cantidad:x.cant,opciones:x.ops,nota:x.nota};})});}
/* Cifra el pedido aquí en el celular (RSA-OAEP + AES-GCM): el servicio de mensajes solo ve datos cifrados */
async function cifrar(texto){var pub=await crypto.subtle.importKey('spki',deB64(M.relevo.clave),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
var aes=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);var iv=crypto.getRandomValues(new Uint8Array(12));
var d=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},aes,new TextEncoder().encode(texto));var k=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,await crypto.subtle.exportKey('raw',aes));
return JSON.stringify({v:1,k:b64(k),iv:b64(iv),d:b64(d)});}
async function enviarRelevo(){var c=datos();if(!c)return;var b=$('enviarRelevo');b.disabled=true;b.textContent='Enviando…';
try{var sobre=await cifrar(pedidoJson(c));if(sobre.length>3900){throw new Error('grande');}
var r=await fetch(M.relevo.servidor+'/'+encodeURIComponent(M.relevo.tema),{method:'POST',body:sobre});if(!r.ok)throw new Error('http');
listo('¡Pedido enviado!','Tu pedido es el <b>#'+codigo+'</b>. El negocio lo recibe en su sistema en unos segundos'+(c.telefono?' y te contactará al '+e(c.telefono):'')+'.');}
catch(err){b.disabled=false;b.textContent='Enviar pedido';alert(err&&err.message==='grande'?'El pedido es muy grande para enviarlo de una vez: divídelo en dos.':'No se pudo enviar. Intenta de nuevo'+(M.whatsapp?' o usa WhatsApp.':'.'));}}
function enviarDirecto(){var c=datos();if(!c)return;var b=$('enviarDirecto');b.disabled=true;b.textContent='Enviando…';
fetch(C.urlPedido,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:codigo,tipo:tipo,canal:'QR',nombre:c.nombre,telefono:c.telefono,direccion:c.direccion,notas:c.notas,mesaId:C.mesaId,claveMesa:C.clave,lineas:carrito.map(function(x){return{productoId:x.id,cantidad:x.cant,opciones:x.ops,nota:x.nota};})})})
.then(function(r){return r.json();}).then(function(r){if(!r.ok){b.disabled=false;b.textContent='Enviar pedido';alert(r.error||'No se pudo enviar. Intenta por WhatsApp.');return;}
listo('¡Pedido recibido!','Tu orden es la <b>#'+r.numero+'</b>. Ya está en cocina.');})
.catch(function(){b.disabled=false;b.textContent='Enviar pedido';alert('No hay conexión con el negocio. Usa el botón de WhatsApp.');});}
})();</script></body></html>
