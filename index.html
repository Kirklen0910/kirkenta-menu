var d=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},aes,new TextEncoder().encode(texto));var k=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,await crypto.subtle.exportKey('raw',aes));
return JSON.stringify({v:1,k:b64(k),iv:b64(iv),d:b64(d)});}
async function enviarRelevo(){var c=datos();if(!c)return;var b=$('enviarRelevo');b.disabled=true;b.textContent='Enviando…';
try{var sobre=await cifrar(pedidoJson(c));if(sobre.length>3900){throw new Error('grande');}
var r=await fetch(M.relevo.servidor+'/'+encodeURIComponent(M.relevo.tema),{method:'POST',body:sobre});if(!r.ok)throw new Error('http');
listo('¡Pedido enviado!','Tu pedido es el <b>#'+codigo+'</b>. El negocio lo recibe en su sistema en unos segundos'+(c.telefono?' y te contactará al '+e(c.telefono):'')+'.');}
catch(err){b.disabled=false;b.textContent='Enviar pedido';alert(err&&err.message==='grande'?'El pedido es muy grande para enviarlo de una vez: divídelo en dos.':'No se pudo enviar. Intenta de nuevo'+(M.whatsapp?' o usa WhatsApp.':'.'));}}

fetch(C.urlPedido,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:codigo,tipo:tipo,canal:'QR',nombre:c.nombre,telefono:c.telefono,direccion:c.direccion,notas:c.notas,mesaId:C.mesaId,claveMesa:C.clave,lineas:carrito.map(function(x){return{productoId:x.id,cantidad:x.cant,opciones:x.ops,nota:x.nota};})})})
